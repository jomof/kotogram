grammar_point: 込む (to do thoroughly)
meaning: To do thoroughly; to do deeply; to remain in a state
conjugations:
  - conjugation-type: dictionary (plain non-past)
    form: '[Verb Stem] + 込む'
    rarity: common
    meaning: to do thoroughly/deeply; to remain in a state
  - conjugation-type: non-past polite (～ます)
    form: '[Verb Stem] + 込みます'
    rarity: common
    meaning: to do thoroughly/deeply; to remain in a state (polite)
  - conjugation-type: negative plain (～ない)
    form: '[Verb Stem] + 込まない'
    rarity: common
    meaning: not to do thoroughly/deeply; not to remain in a state
  - conjugation-type: negative non-past polite (～ません)
    form: '[Verb Stem] + 込みません'
    rarity: common
    meaning: not to do thoroughly/deeply; not to remain in a state (polite)
  - conjugation-type: past plain (～た)
    form: '[Verb Stem] + 込んだ'
    rarity: common
    meaning: did thoroughly/deeply; remained in a state
  - conjugation-type: past polite (～ました)
    form: '[Verb Stem] + 込みました'
    rarity: common
    meaning: did thoroughly/deeply; remained in a state (polite)
  - conjugation-type: te-form (～て)
    form: '[Verb Stem] + 込んで'
    rarity: common
    meaning: doing thoroughly/deeply; remaining in a state (connecting form)
  - conjugation-type: volitional (～よう)
