    rarity: common
    meaning: Let's do thoroughly/deeply; let's remain in a state (polite)
  - conjugation-type: conditional (～たら)
    form: '[Verb Stem] + 込んだら'
    rarity: common
    meaning: If one does thoroughly/deeply; if one remains in a state
  - conjugation-type: conditional (～ば)
    form: '[Verb Stem] + 込めば'
    rarity: common
    meaning: If one does thoroughly/deeply; if one remains in a state
  - conjugation-type: concessive (～ても)
