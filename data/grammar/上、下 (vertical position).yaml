    japanese:
      - 猫 は テーブル の {上} に い ます。
      - テーブル の {上} に 猫 が い ます。
      - 猫 は テーブル の {上} に いる。
      - テーブル の {上} に 猫 が いる。
      - 猫、テーブル の {上} だ よ。
      - テーブル の {上} に 猫 が いる よ。
      - 猫 が テーブル の {上} に いる ん だ。
      - テーブル の {上} に 猫 いる。
      - 猫 は テーブル の {上} に いる ぜ。
      - 猫 は テーブル の {上} に いる わ よ。
      - テーブル の {上} に 猫 が いる じゃ ない。
      - 猫、テーブル の {上}。
      - テーブル の {上} だ な。
      - テーブル の {上} よ。
      - 猫 は テーブル の {上} に いる ん です よ。
    english_literally: Cat is table's top/above at exists.
    competing_grammar:
      - competing_japanese:
          - 猫 は テーブル の {手前} に い ます。
        english: The cat is in front of the table.
        hint: 手前 indicates a position horizontally in front of something, not vertically on top of it.
          We're looking for 'on the table'.
      - competing_japanese:
          - 会議 は 報告 書 の {上} で 行 わ れ た。
        english: The meeting was held based on the report.
        hint: The grammar point refers to a physical 'on top of'. This sentence uses {上} to mean 'on the
          basis of' or 'in the context of', which is an abstract usage. We're looking for physically placing
          the cat onto the table.
      - competing_japanese:
          - 猫 が テーブル {で} い ます。
        english: The cat exists doing something at the table.
        hint: The particle {で} indicates the location where an action occurs, not just where something
          exists. We're looking for where the cat exists.
      - competing_japanese:
          - 猫 は テーブル の {真上} に い ます。
        english: The cat is directly above the table.
        hint: 「真上」 implies the cat is floating directly above the table, not physically on its surface.
          We're looking for the cat being physically on the table.
      - competing_japanese:
          - 猫 は テーブル の {横} に い ます。
        english: The cat is beside the table.
        hint: 横 (yoko) indicates a horizontal position next to something. We're looking for the cat being
          *on top of* the table.
