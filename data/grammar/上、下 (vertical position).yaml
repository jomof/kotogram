post_example_writeup: The usage of particles with 上 and 下 is crucial. Remember that **に** often marks
  the location of existence, while **を** indicates movement through or along a location. The particle
  **で** would imply an an action *occurring* at that location, which is usually not the primary focus
  when describing simple spatial relationships with 上 and 下. Pay close attention to the verb used in the
  sentence to ensure the particle choice aligns with the intended meaning. When expressing location, `に`
  is typically used with verbs of existence like `いる` (for animate objects) and `ある` (for inanimate objects).
