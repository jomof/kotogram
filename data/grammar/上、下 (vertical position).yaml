grammar_point: 上、下 (vertical position)
learn_before:
  - Verb[dictionary] (dictionary form)
  - Verb[imperative] (imperative)
  - Verb[よう] (volitional)
  - '[Noun]をください (please give me)'
  - い-Adjective[み] (abstract quality)
  - どうぞ (here you are・please・invitation)
  - な (prohibitive particle)
  - にする (to decide or make)
  - 側 (side or flank)
  - 背面 (back surface spatial)
meaning: above, on, upper / below, under, lower
pronunciation:
  katakana: ウエ, シタ
  romaji: ue, shita
formation:
  Noun + の + 上: Indicates a position vertically higher than the specified noun.
  Noun + の + 下: Indicates a position vertically lower than the specified noun.
jlpt: N5
etymology: The kanji 上 originally depicted a line with a mark above it, symbolizing 'up' or 'above.' Similarly,
  下 showed a line with a mark below it, symbolizing 'down' or 'below.' These visual representations directly
  convey their core spatial meanings, which have been consistently maintained throughout the history of
  Japanese.
writeup: The Japanese words **上** (ue) and **下** (shita) are fundamental for expressing vertical spatial
  relationships. They function much like the English 'above/on' and 'below/under,' respectively. When
  referring to the position of one noun relative to another, they are typically connected using the particle
  **の** (no), as in 「椅子の {上}」 (isu no ue - 'above the chair') or 「テーブルの {下}」 (teeburu no shita - 'under
  the table'). This Noun + の + 上/下 structure is very common and straightforward. It's important to remember
  that 上 and 下 specifically refer to vertical orientation. While their primary use is for literal physical
  positioning, they can also appear in more abstract or idiomatic expressions, such as 「法律の {上}」 (hōritsu
  no ue - 'above the law' or 'according to law') or 「管理職の {下}」 (kanrishoku no shita - 'under management').
  However, for this grammar point, we will focus on their core **vertical spatial** meaning.
false_friends:
  - term: 〜の上で (~no ue de)
    meaning: on the basis of, in the context of, after (doing something)
    kind: similar expression
    nuance: While it contains {上}, this usage of {上} is abstract and indicates a basis or context, not
      a physical 'on top of'. We're looking for physical verticality.
    grammar_point: 〜の上で (on the basis of)
  - term: 〜の下で (~no shita de)
    meaning: under the guidance of, under the circumstances of
    kind: similar expression
    nuance: Similar to {〜の上で}, this {下} implies an abstract condition or influence, not a physical 'underneath'.
      We're looking for physical verticality.
    grammar_point: <suggest>:〜の下で (abstract circumstances)
  - term: 手前 (temae)
    meaning: in front of, just before
    kind: similar expression
    nuance: 手前 indicates a position *in front of* something, horizontally, or just *before* a point in
      time or space. It does not indicate vertical spatial relationships like {上} or {下}.
    grammar_point: 手前 (before; in front of; on account of)
  - term: 真上 (mau)
    meaning: directly above
    kind: similar expression
    nuance: 「真上」 is more precise than 「上」, specifically indicating a position *directly* above. 「上」 can
      be more general, referring to anything in a higher vertical plane.
    grammar_point: 真上 (directly above)
  - term: 真下 (mashita)
    meaning: directly below
    kind: similar expression
    nuance: 「真下」 is more precise than 「下」, specifically indicating a position *directly* below. 「下」 can
      be more general, referring to anything in a lower vertical plane.
    grammar_point: 真下 (directly below)
post_false_friends_writeup: Understanding the core spatial meaning of **上** and **下** is crucial. When
  you see them used in phrases like **〜の上で** or **〜の下で** in an abstract sense, remember that the meaning
  has shifted from literal physical location to a more conceptual 'basis' or 'circumstance.' Pay close
  attention to the surrounding context to determine if it's a physical or abstract meaning. Hand signals
  can help too!
