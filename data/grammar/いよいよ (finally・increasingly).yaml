grammar_point: いよいよ (finally・increasingly)
learn_before:
  - (よ)う (let’s, shall we)
meaning: At last, Finally, More and more
pronunciation:
  katakana: イヨイヨ
  romaji: iyoiyo
formation:
  いよいよ + [Statement]: Indicates that something is finally happening or is increasingly progressing.
jlpt: N2
etymology: The term 「いよいよ」 originates from the classical Japanese word 弥 (iyo), an intensifying element
  that conveyed a sense of increasing or growing. Its reduplicated form, 弥弥 (iyoiyo), amplifies this meaning,
  leading to its dual modern senses of 'more and more' and 'finally' reaching a climactic point after
  a period of progression or anticipation.
writeup: 「いよいよ」, typically written in hiragana, is an adverb used to express two primary ideas. Firstly,
  it signifies that something has or will **finally happen**, often after a period of anticipation, preparation,
  or ongoing development. This usage implies a sense of culmination, as if a process has naturally led
  to this decisive moment. For example, it can express the excitement or gravity of an event that has
  been eagerly awaited.Secondly, 「いよいよ」 can convey the idea of something becoming **more and more** or
  increasingly intense. In this context, it highlights a state or condition that is progressing in severity
  or degree, often reaching a significant point. The specific nuance, whether "finally" or "more and more,"
  is usually clear from the context of the sentence that follows.Like many adverbs that modify the entire
  sentence, 「いよいよ」 most commonly appears at the beginning of a phrase.
false_friends:
  - term: 一方だ
    meaning: More and more, Continue to, Keep on, -er and -er
    kind: synonym
    nuance: 「一方だ」 emphasizes a continuous trend or direction, often neutral or negative, without necessarily
      implying a conclusive or climactic outcome, unlike 「いよいよ」 which often suggests the approach of a
      significant point.
    grammar_point: '[Verb-dictionary]一方だ (more and more・continuous change)'
  - term: とうとう
    meaning: Finally, At last
    kind: synonym
    nuance: 「とうとう」 often implies a sense of inevitability or a result after a long wait, sometimes with
      a feeling of exasperation or relief, but it does not carry the 'increasing intensity' meaning that
      「いよいよ」 does.
    grammar_point: とうとう (finally・eventually)
  - term: 遂に
    meaning: Finally, At last
    kind: synonym
    nuance: 「遂に」 (ついに) emphasizes the successful achievement or resolution of something after significant
      effort or a long process, conveying a strong sense of accomplishment. This is a more formal and
      conclusive 'finally' than 「いよいよ」, which can indicate an approaching climax rather than a completed
      outcome.
    grammar_point: 遂に (finally・at last)
  - term: ようやく
    meaning: Finally, at long last, with difficulty
    kind: similar expression
    nuance: 「ようやく」 strongly implies that something was difficult to achieve or took a very long time,
      often conveying a sense of relief upon its completion. 「いよいよ」, while also meaning 'finally,' emphasizes
      the natural culmination or an approaching significant moment, not necessarily the difficulty of
      the preceding process.
    grammar_point: <suggest>:ようやく (finally, at long last, with difficulty)
  - term: ますます
    meaning: Increasingly, more and more, decreasingly, less and less
    kind: synonym
    nuance: While both can mean 'more and more,' 「ますます」 is a more neutral term for a continuous increase
      or decrease. 「いよいよ」 in its 'increasingly' sense suggests that the state or condition is reaching
      a critical or climactic point, often with an associated emotional intensity.
    grammar_point: ますます (more and more)
post_false_friends_writeup: These expressions share the core meaning of 'finally' or 'increasingly' but
  differ in nuance. 「いよいよ」 conveys a sense of anticipation and an approaching climax or significant stage.
  In contrast, 「とうとう」 often implies an inevitable outcome after a period of waiting, sometimes with relief
  or resignation, while 「遂に」 highlights a sense of achievement after a long effort. When talking about
  progression, 「一方だ」 describes a steady, often unidirectional trend, whereas 「ますます」 is a more general
  term for continuous increase. 「ようやく」 emphasizes that something was difficult to achieve or took a very
  long time. Understanding these subtle differences will help you choose the most appropriate expression.
examples:
  - english: It's finally my turn. I'm nervous, but I have to do my best!
    japanese:
      - '{いよいよ} 俺 の 番 だ。緊張 する けど 頑張ら なく ちゃ！'
      - '{いよいよ} 私 の 番 です。緊張 し ます けど 頑張ら なく て は なり ませ ん！'
      - '{いよいよ} 俺 の 番 だ。緊張 する けど、やる しか ない！'
    english_literally: Finally, my turn. Nervous, but must do my best!
    competing_grammar:
      - competing_japanese:
          - '{ついに} 俺 の 番 だ。'
        english: Finally, it's my turn (implying the turn has simply arrived).
        hint: We're looking for a word that conveys anticipation and a natural culmination of events.
          While 「ついに」 means 'finally,' it often implies a simple arrival or resolution without the same
          emotional build-up.
    scene: A young man backstage, nervously waiting for his name to be called for the final act of a competition.
    register: casual
    setting: serious
    speaker_gender: male
    nuance: The speaker's use of 「俺 (おれ)」, a casual and masculine first-person pronoun, emphasizes his
      personal stake and determination in this moment.
  - english: The project we prepared for a long time will finally be completed.
    japanese:
      - 長い 間 準備 し た プロジェクト が、{いよいよ} 完成 する。
      - 長い 間 準備 し た プロジェクト が、{いよいよ} 完成 し ます。
      - 長年 準備 し て き た プロジェクト が、{いよいよ} 完成 いたし ます。
    english_literally: Long time prepared project finally completes.
    competing_grammar:
      - competing_japanese:
          - 長い 間 準備 し た プロジェクト が、{ついに} 完成 する。
        english: The project we prepared for a long time will finally be completed (suggesting a straightforward
          arrival of completion).
        hint: We're looking for a word that emphasizes the culmination of extensive effort and natural
          progression towards a significant milestone. 「ついに」 can simply mean 'finally' without the same
          emphasis on anticipation and buildup.
      - competing_japanese:
          - 長い 間 準備 し た プロジェクト が、{ようやく} 完成 する。
        english: The project we prepared for a long time finally completed (implying it was difficult
          or took a long time).
        hint: We're looking for a word that highlights the natural culmination and anticipation of a project's
          completion. 「ようやく」 emphasizes the struggle or difficulty leading up to the completion, which
          is not the main nuance here.
    scene: A team leader announces the imminent completion of a major, months-long corporate project,
      and everyone breathes a sigh of relief as their hard work culminates.
    register: semi-formal
    setting: professional
  - english: The cold has become more and more severe.
    japanese:
      - 寒 さ が {いよいよ} 厳しく なっ て き た。
      - 寒 さ が {いよいよ} 厳しく なっ て き まし た。
      - 寒 さ が {いよいよ} 本格 的 に なっ て き た。
    english_literally: Coldness more and more severe has become.
    competing_grammar:
      - competing_japanese:
          - 寒 さ が {ますます} 厳しく なっ て き た。
        english: The cold has become increasingly severe.
        hint: We're looking for a word that suggests a noticeable and significant increase in intensity,
          often leading to a critical point. 「ますます」 is a more general term for 'increasingly' without
          the same emphasis on a cumulative effect reaching a peak.
    scene: Walking outside, a woman pulls her coat tighter as the wind bites harder, realizing winter's
      chill is truly setting in, noticeably increasing in intensity.
    register: casual
    setting: reflective
  - english: His story is boring, and I'm getting more and more sleepy.
    japanese:
      - 彼 の 話 は 退屈 で、{いよいよ} 眠く なっ て き た。
      - 彼 の 話 は 退屈 で、{いよいよ} 眠く なっ て き まし た。
      - 彼 の 話 は 退屈 で、{いよいよ} 限界 に 眠く なっ て き た。
    english_literally: His story is boring, and more and more sleepy has become.
    competing_grammar:
      - competing_japanese:
          - 彼 の 話 は 退屈 で、{だんだん} 眠く なっ て き た。
        english: His story is boring, and I'm gradually getting sleepy.
        hint: We're looking for a word that emphasizes an intensifying feeling reaching a critical threshold,
          implying an impending consequence. 「だんだん」 merely suggests a gradual increase without the same
          urgency.
    scene: During a long, monotone lecture, a student's eyelids grow heavier with each passing minute,
      reaching a point where falling asleep is almost inevitable.
    register: casual
    setting: serious
  - english: The departure day for the trip is finally approaching tomorrow.
    japanese:
      - 旅行 の 出発 日 が {いよいよ} 明日 に 迫っ て いる。
      - 旅行 の 出発 日 が {いよいよ} 明日 に 迫っ て い ます。
      - 旅行 の 出発 日 が、{いよいよ} 明日 と なり ます。
    english_literally: Trip's departure day finally tomorrow to approaching is.
    competing_grammar:
      - competing_japanese:
          - 旅行 の 出発 日 が {ついに} 明日 に 迫っ て いる。
        english: The departure day for the trip is finally approaching tomorrow (meaning it just arrived).
        hint: We're looking for a word that captures the building excitement and anticipation of an imminent
          and highly awaited event. 「ついに」 might imply more of a relief that the day has come, rather than
          the thrill of the approaching moment.
    scene: Two friends are excitedly packing their bags, constantly checking their watches and the calendar
      as their much-anticipated international trip is just hours away, building anticipation for the moment.
    register: casual
    setting: excited
  - english: The release of the new product has finally been decided for next month.
    japanese:
      - 新 製品 の 発売 が {いよいよ} 来月 に 決定 し まし た。
      - 新 製品 の 発売 が、{いよいよ} 来月 に 決定 いたし まし た。
      - 新 製品 の 発売 が {いよいよ} 来月 に 決まっ た。
    english_literally: New product's launch finally next month decided was.
    competing_grammar:
      - competing_japanese:
          - 新 製品 の 発売 が {ついに} 来月 に 決定 し まし た。
        english: The release of the new product was finally decided for next month (suggesting a resolution
          after difficulty).
        hint: We're looking for a word suitable for announcing a long-awaited event, implying a natural
          culmination. 「ついに」 might sound more like a struggle to reach the decision rather than a confident
          announcement of a determined date.
    scene: In a corporate board meeting, the CEO proudly announces the fixed launch date for their highly
      anticipated new tech product, a culmination of months of development.
    register: bijinesu nihongo (business)
    setting: professional
  - english: The tension between the two of them is getting higher and higher.
    japanese:
      - 二 人 の 間 の 緊張 が {いよいよ} 高まっ て き た。
      - 二 人 の 間 の 緊張 が {いよいよ} 高まっ て き まし た。
      - 二 人 の 間 の 緊張 が {いよいよ} 厳しく なっ て き た。
    english_literally: Two people's between tension more and more risen has come.
    competing_grammar:
      - competing_japanese:
          - 二 人 の 間 の 緊張 が {ますます} 高まっ て き た。
        english: The tension between the two of them is increasingly getting higher.
        hint: We're looking for a word that suggests the escalating tension is nearing a critical or breaking
          point, adding a sense of impending climax. 「ますます」 describes a general increase without the same
          dramatic implication.
    scene: Observing two colleagues arguing, a third person notices their voices getting louder and their
      expressions hardening, indicating the situation is becoming increasingly volatile.
    register: semi-formal
    setting: serious
  - english: My years of effort have paid off, and I will finally have my graduation ceremony.
    japanese:
      - 長年 の 努力 が 実り、{いよいよ} 卒業 式 を 迎える。
      - 長年 の 努力 が 実り、{いよいよ} 卒業 式 を 迎え ます。
      - 長年 の 努力 が 実り、{いよいよ} 卒業 式 と なり ます。
    english_literally: Long years' effort bore fruit, finally graduation ceremony will greet.
    competing_grammar:
      - competing_japanese:
          - 長年 の 努力 が 実り、{ついに} 卒業 式 を 迎える。
        english: My years of effort have paid off, and I will finally have my graduation ceremony (emphasizing
          the simple fact of arrival).
        hint: We're looking for a word that captures the sense of a natural, earned conclusion after prolonged
          effort, emphasizing the fulfillment of a long-term goal. 「ついに」 might imply a more difficult
          or surprising achievement, rather than a well-deserved culmination.
      - competing_japanese:
          - 長年 の 努力 が 実り、{ようやく} 卒業 式 を 迎える。
        english: My years of effort paid off, and I finally (after difficulty) have my graduation ceremony.
        hint: We're looking for an term that conveys the expected and anticipated culmination of years
          of effort. 「ようやく」 emphasizes that the outcome was difficult to achieve or took a very long time,
          which isn't the primary focus of this emotional moment.
    scene: A university student reflects on their entire academic journey, from late-night studies to
      challenging exams, now just days away from receiving their diploma, feeling the culmination of their
      hard work.
    register: semi-formal
    setting: reflective
  - english: Her physical condition seems to be getting worse and worse.
    japanese:
      - 彼女 の 体調 は {いよいよ} 悪く なっ て いる よう だ。
      - 彼女 の 体調 は {いよいよ} 悪く なっ て いる よう です。
      - 彼女 の 体調 は {いよいよ} 悪化 し て いる よう だ。
    english_literally: Her physical condition more and more bad has become it seems.
    competing_grammar:
      - competing_japanese:
          - 彼女 の 体調 は {ますます} 悪く なっ て いる よう だ。
        english: Her physical condition seems to be increasingly getting worse.
        hint: We're looking for a word that emphasizes a significant, potentially critical, progression
          of a negative state. 「ますます」 is a more neutral descriptor of continuous increase without the
          same implication of nearing a severe stage.
    scene: A doctor sadly informs a family about a patient's continuously declining health, noting a significant
      and increasing deterioration.
    register: formal
    setting: serious
  - english: It's curtain time, and the curtain is finally opening.
    japanese:
      - 開演 時間 に なり、{いよいよ} 幕 が 開く。
      - 開演 時間 に なり、{いよいよ} 幕 が 開き ます。
      - 開演 時間 に なり、{いよいよ} 幕 が 上がる。
    english_literally: Opening time has become, finally curtain opens.
    competing_grammar:
      - competing_japanese:
          - 開演 時間 に なり、{とうとう} 幕 が 開く。
        english: It's curtain time, and the curtain finally opens (implying it took a long time or there
          was a struggle).
        hint: We're looking for a word that conveys the mounting excitement and the grand, anticipated
          moment of a performance beginning. 「とうとう」 might imply more relief or a sense of 'finally, after
          all that waiting,' which is less about the dramatic reveal.
    scene: The theater lights dim, the audience hushes, and a collective gasp goes through the crowd as
      the grand curtain begins to rise, marking the much-anticipated start of the show.
    register: formal
    setting: excited
post_example_writeup: As you can see from the examples, 「いよいよ」 effectively conveys both the culmination
  of a long-awaited event and the progressive intensification of a state or condition. Pay close attention
  to the context to distinguish between these two senses. It's often used when there's a strong emotional
  component of anticipation or gravity.
sources:
  bunpro: https://bunpro.jp/grammar_points/いよいよ
