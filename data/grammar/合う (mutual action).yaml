post_example_writeup: The core meaning of 「〜合う」 is indeed reciprocal action. While it often implies cooperation,
  as seen in 「助け合う」 (to help each other) or 「話し合う」 (to discuss with each other), it can also denote mutual
  competition or opposition, as in 「競い合う」 (to compete with each other) or even 「取り合う」 (to snatch from
  each other), where the action is directed towards one another, albeit not always harmoniously. The key
  is the multi-directional, shared nature of the action.
