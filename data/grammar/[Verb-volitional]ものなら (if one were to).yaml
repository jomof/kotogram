    setting: academic
    speaker_gender: male
    listener_gender: male
    nuance: The use of 「きっと」 (surely) combined with the strong conditional 「ものなら」 emphasizes the inevitability
      of the negative outcome. The casual 「よ」 at the end is common among male friends in a warning context,
      making the statement more direct and personal.
