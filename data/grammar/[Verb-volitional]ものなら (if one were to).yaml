    speaker_gender: female
    listener_gender: male
    nuance: The phrase 「徹底的 に 潰さ れる」 (would be utterly crushed) emphasizes the severe and complete nature
      of the negative consequence. 「だろう」 adds a slight level of speculation, but the preceding 「ものなら」
      ensures the strong sense of certainty regarding the outcome. This tone is common in semi-formal,
      cautionary discussions among colleagues.
  - english: If you were to post something like that online, you'd regret it later.
    japanese:
      - そんな こと を ネット に 投稿 しよう {もの なら}、後 で 後悔 する よ。
      - そんな こと を ネット に 投稿 しよう {もの なら}、後 で 後悔 する でしょう。
      - そんな こと を ネット に 投稿 しよう {もの なら}、後 で 痛い 目 に あう よ。
      - そんな こと を ネット に 投稿 しよう {もの なら}、後 で 泣き を 見る よ。
    english_literally: Such a thing online if you were to post, later regret will do, you know.
    competing_grammar:
      - competing_japanese:
          - そんな こと を ネット に 投稿 し {たら}、後 で 後悔 する よ。
        english: If you post something like that online, you'll regret it later.
        hint: 「たら」 is a general conditional. We're looking for a stronger emphasis on the inevitable negative
          consequence, which 「ものなら」 conveys.
      - competing_japanese:
          - そんな こと を ネット に 投稿 すれ {ば}、後 で 後悔 する よ。
        english: If you post something like that online, you'll regret it later.
        hint: 「ば」 is a general conditional. 「ものなら」 emphasizes the certainty of the regrettable outcome
          more strongly.
    scene: A friend warns another against posting something sensitive or controversial on social media.
    register: casual
    setting: cautious
    nuance: The use of 「よ」 makes it a direct, personal warning between friends. The phrase 「後で 後悔 する」
      emphasizes the future negative emotional consequence, heightened by 「ものなら」.
  - english: If you were to tell a lie, your parents would never trust you again.
    japanese:
      - 嘘 を つこう {もの なら}、お 父 さん と お 母 さん は 二 度 と あなた を 信じ ない だろう。
      - 嘘 を つこう {もの なら}、二 度 と 信用 し て もらえ ない よ。
      - 嘘 を つこう {もの なら}、二 度 と 信用 を 得 られ ない でしょう。
      - 嘘 を つこう {もの なら}、マジ で 信用 なくす よ。
    english_literally: A lie if you were to tell, dad and mom will never trust you again.
    competing_grammar:
      - competing_japanese:
          - 嘘 を つい {たら}、お 父 さん と お 母 さん は 二 度 と あなた を 信じ ない だろう。
        english: If you tell a lie, your parents will never trust you again.
        hint: 「たら」 is a general conditional. 「ものなら」 emphasizes the absolute and lasting consequence of
          losing trust.
      - competing_japanese:
          - 嘘 を つけ {ば}、お 父 さん と お 母 さん は 二 度 と あなた を 信じ ない だろう。
        english: If you tell a lie, your parents will never trust you again.
        hint: 「ば」 is a general conditional. 「ものなら」 conveys a stronger, more certain negative outcome regarding
          family trust.
    scene: A parent warns their child about the consequences of lying, emphasizing the loss of trust.
    register: casual
    setting: serious
    nuance: This emphasizes the lasting impact on trust within a family. The consequence is not physical
      but relational, highlighting the gravity of the action through the strong implication of 「ものなら」.
post_example_writeup: As seen in these examples, 「ものなら」 consistently attaches to the volitional form of
  verbs and invariably points to a **negative, undesirable, or highly problematic outcome** that is expected
  to follow the hypothetical action. This consistent pattern of 'action leading to inevitable bad consequence'
  is central to its usage.
