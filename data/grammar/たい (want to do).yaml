      - competing_japanese:
          - 私 は 彼 ら と 一緒 に 旅行 に {行っ て ほしく あり ませ ん}。
        english: I don't want them to go on a trip.
        hint: This expresses wanting *someone else* to not go on a trip. We're looking for *your own*
