pronunciation:
  katakana: タイ
  romaji: tai
formation:
  Verb (ます-stem) + たい: Expresses the speaker's desire to perform an action. Conjugates like an い-adjective.
jlpt: N5
etymology: The auxiliary adjective 「たい」 is believed to have evolved from classical Japanese forms expressing
  desire or inclination. While its precise origin is complex, it is often linked to the verb 「足る (たりる)」
  (tariru), meaning "to be sufficient" or "to be enough." This connection suggests an underlying nuance
  of wanting something to be 'enough' or 'sufficient' to satisfy a desire. Over time, its usage became
  grammaticalized to specifically indicate a personal wish or aspiration to perform an action, differentiating
  it from expressions of wanting objects.
writeup: |-
  The auxiliary adjective 「たい」 is used to express one's desire to perform an action, translating to "want to do" or "would like to do." It attaches directly to the **ます-stem** of a verb. For example, from 食べます (tabemasu), the ます-stem is 食べ (tabe), so 食べたい (tabetai) means "want to eat."

  「たい」 conjugates exactly like an **い-adjective**. This means its negative form is 「たくない」, its past form is 「たかった」, and its negative past form is 「たくなかった」. Polite forms include 「たいです」, 「たくないです」, 「たかったです」, and 「たくなかったです」.

  ### Usage with Particles を and が

  When expressing the object of the desired action, both the 「を」 particle and the 「が」 particle can be used. For instance, you can say 「寿司を食べたい (sushi o tabetai)」 or 「寿司が食べたい (sushi ga tabetai)」. While both are grammatically correct, using 「が」 often implies a **stronger, more specific desire** for that particular object, highlighting it as the focus of the wanting. The 「を」 particle tends to indicate a more general desire to perform the action.

  ### Speaker and Context

  「たい」 is primarily used for expressing **the speaker's own desires**. In declarative sentences, it almost exclusively refers to the first person. For example, 「私は日本に行きたい (Watashi wa Nihon ni ikitai)」 means "I want to go to Japan."

  When asking about someone else's desires (second person), 「たい」 is used in **interrogative sentences**. For example, 「あなたは何がしたいですか？ (Anata wa nani ga shitai desu ka?)」 means "What do you want to do?"

  It is generally **not used to guess or state what a third person wants** without direct evidence or questioning. For third-person desires that are observable or inferred, the auxiliary verb 「たがる」 (tagaru) or 「がる」 (garu) is typically used (e.g., 「彼は日本に行きたがっている (Kare wa Nihon ni ikitagatte iru)」 - "He seems to want to go to Japan."). However, it can be used for the third person if it's a direct quote or something the speaker knows for a fact (e.g., 「彼が日本に行きたいと言いました (Kare ga Nihon ni ikitai to iimashita)」 - "He said he wants to go to Japan.").

  ### Important Considerations

  *   **Not for Commands/Requests**: Do not use 「たい」 to tell someone else what you want them to do. For that, use expressions like 「〜てほしい」 (te hoshii), meaning "I want you to do..."
  *   **Not for Invitations**: While 「〜ませんか」 (masen ka) or 「〜ましょうか」 (mashō ka) are common for invitations, 「たい」 is generally not used for inviting someone to do something *with* you. For example, instead of 「映画を見たいですか？ (Eiga o mitai desu ka?)」 (Do you want to see a movie? - sounds like asking about their personal desire), you would typically say 「映画を見ませんか？ (Eiga o mimasen ka?)」 (Why don't we see a movie?)

  Understanding these nuances is key to using 「たい」 naturally and appropriately in Japanese.
false_friends:
  - term: てほしい
    meaning: I want you to do...
    kind: often confused with
    nuance: Unlike 「たい」, which expresses the speaker's desire to perform an action, 「てほしい」 expresses what
      the speaker wants *someone else* to do.
    grammar_point: '[Verb-て]ほしい (to want someone to do)'
  - term: ほしい
    meaning: To want something; to be in need of
    kind: similar expression
    nuance: 「ほしい」 expresses the desire for a *thing* (a noun), while 「たい」 expresses the desire to *perform
      an action* (a verb).
    grammar_point: '[Noun]が欲しい (to want something)'
  - term: たがる
    meaning: To show signs of wanting to do (something) (third person)
    kind: similar expression
    nuance: '「たがる」 is used to describe what a third person *appears* to want based on observation, whereas
      「たい」 is used for expressing *your own* direct desires. They can be used when the speaker is a third
      party, and they cannot directly know the feelings of the person they are talking about. You could
      say 「彼 は ゲーム が 欲しい です」 instead of 「彼 は ゲーム を 欲しがっ て い ます」 if you are referring to a desire that
      the third person has expressed to you, for example. It is not necessarily wrong to use 「が欲しい」 for
      third persons when you are certain of their feelings based on their communication, but it is often
      more natural to use 「たがる」 to express desires of third parties, as it emphasizes that it is an observation
      of their behavior rather than a direct statement of their feelings. The nuance is that 「たがる」 implies
      observation of outward signs of desire, such as actions or words, rather than directly knowing the
      person''s internal feelings. For example, a child pointing at a toy would be described with 「欲しがっている」.
      This is a common point of confusion for learners, but understanding the difference between direct
      knowledge (which can allow 「〜が欲しい」 with a third person if explicitly stated by them) and inferred
      desire (which typically uses 「たがる」 or 「がる」) is crucial for natural communication. The key is that
      「たがる」 makes the speaker''s knowledge explicit: they infer the desire based on observed behavior.
      Therefore, 「たがる」 and 「がる」 are more commonly used when discussing what a third person desires, even
      if you are certain of their feelings, because it is always an observation from your side, not a
      direct feeling. This highlights the Japanese tendency to express things from an external, observational
      perspective when referring to others'' internal states, rather than assuming direct knowledge.'
    grammar_point: '[い-Adjective-stem]がる・[な-Adjective]がる (to show signs of feeling)'
  - term: がる
    meaning: To feel, to think, to act as if, to want, to desire
    kind: similar expression
    nuance: 「がる」 is a broader expression indicating observable behavior that suggests a feeling or desire
      in a third person, not necessarily restricted to wanting to *do* an action. It contrasts with 「たい」
      which is a direct statement of personal desire.
    grammar_point: '[い-Adjective-stem]がる・[な-Adjective]がる (to show signs of feeling)'
  - term: つもりだ
    meaning: To intend to; to plan to; to believe that
    kind: similar expression
    nuance: 「つもりだ」 expresses a firm intention or a belief about a future action or state. Unlike 「たい」,
      it does not carry the nuance of desire or wanting, but rather a decision or conviction.
    grammar_point: '[Verb-dictionary]つもりだ (to intend to)'
  - term: Verb[volitional-よう]+思う
    meaning: To think one will; to intend to
    kind: similar expression
    nuance: This expresses a speaker's intention or a thought about what they will do. While it implies
      a decision, it lacks the strong emotional component of desire found in 「たい」. It's more about a planned
      action than a deep longing.
    grammar_point: '[Verb-よう]思う (intend to)'
post_false_friends_writeup: It is crucial to distinguish between expressing your own desires to perform
  an action (using 「たい」), wanting to possess a specific item (using 「ほしい」), and describing what others
  appear to want (using 「たがる」 or 「がる」). Additionally, differentiate desire from intention (「つもりだ」 or 「〜ようと思う」),
  as these convey a decision or plan rather than a longing.
examples:
  - english: When work is over, I want to go home quickly.
    japanese:
      - 仕事 が 終わっ たら、早く 家 に {帰り たい}。
      - 仕事 終わっ たら、早く 家 に {帰り たい}。
      - 仕事 が 終わっ たら、早く 家 に {帰り たい} です。
      - 仕事 が 終わっ たら、早く 家 に {帰り たい} なあ。
      - 仕事 終わっ たら、早く 家 {帰り たい}。
      - 仕事 が 終わっ たら、早く 家 に {帰り たい} ん です けど。
      - 仕事 が 終わっ たら、早く 家 に {帰り たい} よ ね。
    english_literally: Work is over, then quickly home want to return.
    competing_grammar:
      - competing_japanese:
          - 仕事 が 終わっ たら、早く 家 に 帰り たい と {思う}。
        english: When work is over, I think I want to go home quickly.
        hint: The inclusion of 「と 思う」 adds a layer of thinking or considering the desire. We're looking
          for a direct expression of desire.
      - competing_japanese:
          - 仕事 が 終わっ たら、早く 家 に {帰っ て ほしい}。
        english: When work is over, I want someone to go home quickly.
        hint: This expresses wanting *someone else* to go home. We're looking for your *own* desire to
          go home.
    scene: A tired worker is reflecting on their day and yearning for home.
    register: casual
    setting: reflective
    conjugation: dictionary (plain non-past)
  - english: I want to buy a new smartphone.
    japanese:
      - 新しい スマート フォン を {買い たい} です。
      - 新しい スマート フォン が {買い たい} です。
      - 新しい スマート フォン を {買い たい}。
      - 新しい スマート フォン、{買い たい} なあ。
      - 新しい スマート フォン を {買い たい} ん です。
      - 新しい スマート フォン、{買い たい}。
      - 新しい スマート フォン を {買い たい} と 思っ て い ます。
      - 新しい スマート フォン を {買い たい} ん です けど、どれ が いい です か？
    english_literally: New smartphone (object) want to buy (polite).
    competing_grammar:
      - competing_japanese:
          - 新しい スマート フォン が {欲しい} です。
        english: I want a new smartphone (as a thing).
        hint: The speaker is expressing a desire to perform an action (buying the smartphone), not merely
          to possess the smartphone itself. We're looking for a desire to perform an action.
      - competing_japanese:
          - 新しい スマート フォン を {買っ て 欲しい} です。
        english: I want someone to buy a new smartphone for me.
        hint: This expresses wanting *someone else* to buy the smartphone. We're looking for your *own*
          desire to buy it.
    scene: A young woman is discussing her next big purchase with a salesperson in a polite setting.
    register: teineigo (polite)
    setting: professional
    conjugation: non-past polite (～ます)
    speaker_gender: female
    listener_gender: male
  - english: I don't want to go anywhere this weekend.
    japanese:
      - この 週末 は、どこ に も {行き たく ない} な。
      - この 週末 は、どこ に も {行き たく ない} です。
      - この 週末 は、どこ に も {行き たく あり ませ ん}。
      - この 週末 は、どこ に も {行き たく ない} わ。
      - この 週末、どこ に も {行き たく ねえ} な。
      - この 週末 は、どこ に も {行き たく ない} ん です。
      - この 週末 は、どこ に も {行き たく ない} よ。
    english_literally: This weekend, anywhere to not want to go (casual sentence ender).
    competing_grammar:
      - competing_japanese:
          - この 週末 は、どこ に も {行く 気 が し ない}。
        english: This weekend, I don't feel like going anywhere.
        hint: 「行く気がしない」 expresses a lack of motivation, while this example directly states the lack of
          desire. We're looking for a direct statement of personal feeling.
      - competing_japanese:
          - この 週末 は、どこ に も {行っ て ほしく ない}。
        english: This expresses wanting *someone else* to not go home. We're looking for your *own* lack
          of desire to go home.
        hint: This expresses wanting *someone else* to not go. We're looking for your *own* lack of desire
          to go.
    scene: A young man is feeling lazy and tells his friend about his plans (or lack thereof) for the
      weekend.
    register: casual
    setting: friendly
    conjugation: negative plain (～ない)
    speaker_gender: male
    listener_gender: male
    nuance: The casual sentence-ending particle 「な」 in 「行きたくない な」 adds a sense of reflection or mild complaint,
      indicating a personal, somewhat wistful feeling. This is typical for a casual male speaker sharing
      a personal sentiment with a close friend. The very casual 「行きたくねえ」 uses a colloquial contraction
      of 「ない」 to 「ねえ」, which is strongly associated with informal male speech. The use of 「わ」 by a female
      speaker, as in 「行きたくない わ」, often conveys a softer, more emphatic, or explanatory nuance depending
      on context and intonation.
  - english: When I was a child, I always wanted to become a teacher.
    japanese:
      - 子ども の 頃、ずっと 先生 に {なり たかっ た} ん です。
      - 子ども の 頃、ずっと 先生 に {なり たかっ た} ん だ けど。
      - 子ども の 頃、ずっと 先生 に {なり たかっ た} と 申し上げ て おり まし た。
      - 子ども の 頃 から、ずっと 先生 に {なり たかっ た} の。
      - 子ども の 頃、ずっと 先生 に {なり たかっ た} よ。
      - 子ども の 頃 から、ずっと 先生 に {なり たかっ た} ん です よ ね。
      - 子ども の 頃、先生 に {なり たかっ た} なあ。
    english_literally: Child's time, always teacher to wanted to become (explaining particle).
    competing_grammar:
      - competing_japanese:
          - 子ども の 頃、ずっと 先生 に なり たい と {思っ て い まし た}。
        english: When I was a child, I always thought I wanted to become a teacher.
        hint: The phrase 「なりたかったんです」 directly conveys a strong, past desire. The alternative emphasizes
          a continuous state of wanting rather than a past aspiration. We're looking for a direct expression
          of a past desire.
      - competing_japanese:
          - 子ども の 頃、ずっと 先生 に {なっ て ほしかっ た} ん です。
        english: When I was a child, I always wanted someone to become a teacher.
        hint: This expresses wanting *someone else* to become a teacher. We're looking for your *own*
          past desire to become one.
      - competing_japanese:
          - 子ども の 頃、ずっと 先生 に {なっ て い たがっ て い まし た}。
        english: When he was a child, he always seemed to want to become a teacher.
        hint: This form indicates observing a *third person's* past desire. We're looking for a direct
          statement of *your own* past desire.
    scene: An older woman is sharing a childhood dream with a younger generation, explaining a past aspiration.
    register: formal
    setting: storytelling
    conjugation: past polite (～ました)
    speaker_gender: female
    speaker_age: older
    nuance: The addition of 「んです」 at the end, as in 「なりたかった んです」, adds an explanatory or emphatic nuance,
      as if providing context or a reason for a statement. This is commonly used in formal or semi-formal
      storytelling settings, allowing the speaker to share personal history while maintaining politeness.
      The use of 「ずっと」 emphasizes the long-standing nature of the desire. The use of 「の」 as a sentence
      ender, as in 「なりたかった の」, is common in casual female speech for explanation or seeking agreement,
      often adding a soft, inquiring, or explanatory tone.
  - english: If you want to pass the exam, start studying right now.
    japanese:
      - もし 試験 に 合格 し {たけれ ば}、今 すぐ 勉強 を 始め なさい。
      - もし 試験 に 合格 し {たけれ ば}、今 すぐ 勉強 を 始め なさい よ。
      - もし 試験 に 合格 し {たけれ ば}、今 すぐ 勉強 始めろ。
      - もし 試験 に 合格 し {たけりゃ}、今 すぐ 勉強 始めろ。
      - もし 試験 に 合格 し {たけれ ば}、今 すぐ 勉強 し なさい。
      - 試験 に 合格 し {たけりゃ}、今 すぐ 勉強 しろ よ。
    english_literally: If exam pass want to (conditional), right now study start (command).
    competing_grammar:
      - competing_japanese:
          - もし 試験 に 合格 し {たい なら}、今 すぐ 勉強 を 始め なさい。
        english: If you want to pass the exam, then start studying right now.
        hint: While 「～たいなら」 is a valid conditional, this construction implies a stronger, more direct
          condition for the desired outcome. We're looking for a firm, instructional tone that ties the
          desire to the necessary action.
      - competing_japanese:
          - もし 試験 に 合格 し {て 欲しけれ ば}、今 すぐ 勉強 を 始め なさい。
        english: If you want me to pass the exam, start studying right now.
        hint: This implies wanting *the speaker* to pass the exam. We're looking for your *own* desire
          to pass the exam.
    scene: A strict tutor is giving firm advice to a student who is procrastinating.
    register: formal
    setting: instructional
    conjugation: conditional (～ば)
    speaker_age: older
    nuance: The conditional 「たければ」, combined with the imperative 「始めなさい」, creates a direct and authoritative
      tone. 「始めなさい」 is a command form typically used by a superior (like a teacher or parent) to a subordinate,
      emphasizing the serious nature of the advice. This pairing is effective for conveying strong guidance.
      The highly casual 「たけりゃ」 is a contraction of 「たければ」, primarily used by male speakers in informal
      settings. The addition of 「よ」 to the imperative, as in 「始めなさい よ」, softens the command slightly,
      making it sound more like firm advice or encouragement rather than a harsh order, often used by
      a teacher or parent.
  - english: Recently, do you want to start something new?
    japanese:
      - 最近、何 か 新しい 事 を {始め たい} です か？
      - 最近、何 か 新しい 事 が {始め たい} です か？
      - 最近、何 か 新しい 事、{始め たい}？
      - 最近、何 か 新しい 事 {始め たい}？
      - 最近、何 か 新しい 事 を {始め たい} と か ある？
      - 最近、何 か 新しい 事 を {始め たい} と お 考え です か？
      - 最近、何 か 新しい 事 を {始め たい} です か ね。
    english_literally: Recently, something new thing (object) want to start (polite question)?
    competing_grammar:
      - competing_japanese:
          - 最近、何 か 新しい こと を {始める べき です} か？
