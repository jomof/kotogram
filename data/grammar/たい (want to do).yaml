    scene: A person is politely declining an invitation to a group trip they are not interested in joining.
    register: teineigo (polite)
    setting: apologetic
    conjugation: negative non-past polite (～ません)
  - english: The ending of that movie was so sad, I never wanted to see it again.
    japanese:
      - あの 映画 の 終わり 方 が 悲しく て、もう 二 度 と {見 たく なかっ た}。
      - あの 映画 の 終わり 方 が 悲しく て、もう 二 度 と {見 たく なかっ た} よ。
      - あの 映画 の 終わり 方 が 悲しく て、もう 二 度 と {見 たく なかっ た} です。
      - あの 映画 の 終わり 方、悲し すぎ て、もう 二 度 と {見 たく なかっ た} わ。
      - あの 映画 の 終わり 方 が 悲しく て、もう 二 度 と {見 たく なかっ た} の。
      - あの 映画 の 終わり 方 が 悲しく て、もう 二 度 と {見 たく なかっ た} ん です。
      - あの 映画 の 終わり 方 が 悲しく て、もう 二 度 と {見 たく なかっ た} です よ ね。
    english_literally: That movie's ending way sad, already second time not want to see.
    competing_grammar:
      - competing_japanese:
          - あの 映画 の 終わり 方 が 悲しかっ た の で、もう 二 度 と {見る 気 に なれ ませ ん でし た}。
        english: The ending of that movie was sad, so I couldn't bring myself to watch it again.
        hint: 「見る気になれませんでした」 implies a lack of motivation, while this example directly states a strong
          past negative desire. We're looking for a direct expression of personal aversion in the past.
      - competing_japanese:
          - あの 映画 の 終わり 方 が 悲しく て、もう 二 度 と {見 て ほしく なかっ た}。
        english: The ending of that movie was so sad, I never wanted it to be shown again (to me).
        hint: This implies wanting *something* not to happen (e.g., someone not showing it). We're looking
          for your *own* lack of desire to see it.
      - competing_japanese:
          - あの 映画 の 終わり 方 が 悲しく て、彼 は もう 二 度 と {見 たがっ て い なかっ た}。
        english: The ending of that movie was so sad, he never seemed to want to see it again.
        hint: This form indicates observing a *third person's* past desire. We're looking for a direct
          statement of *your own* past desire.
    scene: Someone recounting their emotional experience with a movie, expressing a strong past negative
      desire.
    register: casual
    setting: reflective
    conjugation: negative past plain (～なかった)
    speaker_gender: female
  - english: It was a cold day, so I didn't want to go outside the dorm.
    japanese:
      - 寒い 日 だっ た の で、寮 の 外 に 出 {たく なかっ た} です。
      - 寒い 日 だっ た から、寮 の 外 に 出 {たく なかっ た}。
      - 寒い 日 だっ た の で、寮 の 外 に 出 {たく あり ませ ん でし た}。
      - 寒い 日 だっ た から、寮 の 外、{出 たく なかっ た} もん。
      - 寒い 日 だっ た の で、寮 の 外 に {出 たく なかっ た} の。
      - 寒い 日 だっ た の で、寮 の 外 に は {出 たく なかっ た} です ね。
      - 寒い 日 だっ た から、寮 の 外 に は {出 たく なかっ た} なあ。
    english_literally: Cold day was, so dorm's outside to not want to go (polite).
    competing_grammar:
      - competing_japanese:
          - 寒い 日 だっ た の で、寮 の 外 に {出る 気 が し ませ ん でし た}。
        english: It was a cold day, so I didn't feel like going outside the dorm.
        hint: 「出る気がしませんでした」 implies a lack of motivation, while this expresses a direct lack of desire
          or willingness to perform the action. We're looking for a direct statement of not wanting to
          do something.
      - competing_japanese:
          - 寒い 日 だっ た の で、寮 の 外 に {出 て ほしく なかっ た} です。
        english: It was a cold day, so I didn't want you to go outside the dorm.
        hint: This expresses wanting *someone else* to not go outside. We're looking for *your own* lack
          of desire to go out.
    scene: A student explaining to a friend why they stayed indoors on a particular cold day.
    register: teineigo (polite)
    setting: friendly
    conjugation: negative past polite (～ませんでした)
    speaker_age: younger
  - english: If you wanted to read a book, I can lend it to you anytime.
    japanese:
      - もし あなた が 本 を 読み {たかっ たら}、いつ で も 貸し ます よ。
      - もし あなた が 本 を 読み {たかっ たら}、いつ で も お 貸し いたし ます よ。
      - もし 本 読み {たかっ たら}、いつ で も 貸す よ。
      - もし 本 を 読み {たかっ たら}、いつ で も 貸す から ね。
      - もし あなた が 本 を 読み {たかっ たら}、いつ で も 貸し て あげる よ。
      - もし 本 を 読み {たかっ たら}、いつ で も どうぞ。
      - もし 本 を 読み {たかっ たら}、私 に 声 を かけ て ください。
    english_literally: If you book want to read (conditional), anytime will lend.
    competing_grammar:
      - competing_japanese:
          - もし あなた が 本 を 読み {たい なら}、いつ で も 貸し ます よ。
        english: If you want to read a book, I can lend it to you anytime.
        hint: 「読みたいなら」 refers to a present desire, while this form implies a past desire that might still
          be relevant or a hypothetical situation. We're looking for a conditional based on a previously
          existing or hypothetical desire.
      - competing_japanese:
          - もし 私 に 本 を {読ん で 欲しけれ ば}、いつ で も 貸し ます よ。
        english: If you want me to read the book for you, I can lend it to you anytime.
        hint: This implies wanting *the speaker* to read the book for you. We're looking for your *own*
          past desire to read the book.
    scene: A kind librarian is offering a book to a patron, assuming they might have expressed a past
      desire to read.
    register: teineigo (polite)
    setting: supportive
    conjugation: conditional (～たら)
    speaker_gender: female
    listener_gender: group
    nuance: The use of 「～たら」 as a conditional on the past desire form 「読みたかった」 allows for expressing a
      conditional based on a hypothetical or previously existing desire. The sentence-final particle 「よ」
      adds a friendly and informative tone, typical of someone offering help or information. The casual
      「貸す から ね」 is a friendly way of offering a favor, often used by women or close friends. The phrase
      「お貸しいたします」 is a humble form, showing respect to the listener, typical in a professional setting
      like a library.
post_example_writeup: The examples provided illustrate the versatility of 「たい」 across different grammatical
  forms and registers, from simple casual statements to more formal interrogatives and conditionals. Pay
  close attention to the context and desired nuance when choosing the appropriate form and particle (を
  vs. が) to ensure natural and precise expression of desire.
