      - competing_japanese:
          - 最近、彼 は 何 か 新しい 事 を {始め たがっ て い ます} か？
        english: Recently, does he seem to want to start something new?
        hint: This form asks about *someone else's* observable desire. We're looking for a question about
          *your* desire.
    scene: A mentor is asking a young professional about their career aspirations during a check-in meeting.
