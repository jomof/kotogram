grammar_point: また (again; also; or)
learn_before:
  - 又〜も (additionally)
meaning: Again, also, moreover, in addition
pronunciation:
  katakana: マタ
  romaji: mata
formation:
  Vる + また: Indicates repetition of an action (e.g., 'again').
  N + も + また: Indicates addition of a noun or concept (e.g., 'also', 'too').
  Adjective-い stem + く + また、Sentence: Connects an adjective-い phrase to an additional sentence, introducing
    further information.
  Adjective-な stem / Noun + であり、また、Sentence: Connects an adjective-な or noun phrase to an additional sentence,
    introducing further information.
  Sentence1。また、Sentence2: Connects two independent sentences, where Sentence2 adds further information
    or an alternative to Sentence1.
  Sentence1し、また、Sentence2: Connects two clauses, where Sentence2 adds further information or an alternative
    to Sentence1, often implying a reason or context.
jlpt: N4
etymology: The word 「また」 originates from 「亦」, an old kanji meaning 'also' or 'again.' Over time, the hiragana
  form became the predominant form in everyday usage.
writeup: 「また」, often written as 「又」 in kanji, is a highly versatile expression in Japanese that primarily
  conveys the sense of **repetition** or **addition**. It can function as both an adverb and a conjunction,
  allowing for flexibility in its application. When used to express **repetition**, 「また」 is typically
  translated as "again" or "re-" in English. It signifies that an action or event is occurring once more,
  often the same action as a previous one. For example, if you say 「また 会う」, it means "meet again." In
  its role as a **conjunction**, 「また」 introduces supplementary information, an alternative, or another
  similar item. Here, it functions much like "also," "in addition," "furthermore," or "moreover." The
  action or state described may be different but is related to a previously stated one, or it adds another
  perspective. For instance, in a sentence like 「彼 は 医者 だ。また、音楽家 で も ある。」 (He is a doctor. Also, he is
  a musician.), 「また」 introduces additional information about the same person. As a conjunction, 「また」 can
  begin a sentence, provided that the sentence conveys a complete thought and logically extends or adds
  to the preceding statement. It implies a logical connection between what precedes it and what follows,
  whether that connection is a straightforward repetition or the inclusion of related, yet distinct, information.
  An important usage to note is with the particle 「は」, forming 「または」. This explicitly means "or" and is
  used to present clear alternatives, often in more formal or written contexts, though it can appear in
  speech too. For example, 「コーヒー または 紅茶」 means "coffee or tea."
false_friends:
  - term: 再び
    meaning: Again, once more
    kind: similar expression
    nuance: 「再び」 often implies a formal or literary tone and typically refers to a clear reoccurrence
      of an action, whereas 「また」 is more common in everyday conversation and can also denote addition.
    grammar_point: 再び (again・second time)
  - term: 更に
    meaning: Even more, furthermore
    kind: similar expression
    nuance: 「更に」 suggests a higher degree, an increase, or a deeper continuation of something. It often
      implies a progression or intensification, unlike 「また」 which simply adds another element or repeats
      an action without necessarily implying greater degree.
    grammar_point: 更に (even more)
  - term: それに
    meaning: Besides, in addition to that
    kind: similar expression
    nuance: 「それに」 is used to add something to a previous statement, often providing a reason, an additional
      characteristic, or a consequence that logically follows. While 「また」 can also add information, 「それに」
      often implies a more direct, sometimes causal, link or a stronger logical progression.
    grammar_point: それに (in addition・moreover)
  - term: および
    meaning: and, as well as
    kind: similar expression
    nuance: 「および」 is a highly formal conjunction used to connect nouns, noun phrases, or short clauses,
      typically in written documents, legal texts, or very formal speeches. It signifies 'and' or 'as
      well as' in an exhaustive manner. 「また」, on the other hand, is much more versatile, used in both
      spoken and written contexts, and can connect longer sentences or broader ideas.
    grammar_point: および (and・as well as)
  - term: あるいは
    meaning: or, alternatively
    kind: similar expression
    nuance: 「あるいは」 is used to present an alternative option or possibility, similar to 'or'. While 「また」
      can sometimes imply an 'or' meaning when paired with 「は」 (as in 「または」), 「あるいは」 explicitly functions
      as a conjunction introducing an alternative, often in more formal contexts.
    grammar_point: あるいは (or・alternatively)
  - term: 且つ
    meaning: And; moreover; furthermore
    kind: similar expression
    nuance: 「且つ」 is a formal and literary conjunction used to combine two conditions, characteristics,
      or actions that occur simultaneously or are both true. It often implies 'and at the same time' or
      'moreover.' Unlike 「また」, which can simply add information, 「且つ」 emphasizes a concurrent or combined
      aspect.
    grammar_point: 且つ (and・moreover)
  - term: 上に
    meaning: In addition to, Besides, As well
    kind: similar expression
    nuance: 「上に」 is used to add another piece of information that further supports or enhances the initial
      statement. It implies that something is 'not only X, but also Y,' emphasizing a cumulative effect.
      While 「また」 can also mean 'in addition,' 「上に」 explicitly highlights the layering of qualities or
      conditions.
    grammar_point: 上に (in addition to)
post_false_friends_writeup: While expressions like 「再び」, 「更に」, 「それに」, 「および」, 「あるいは」, 「且つ」, and 「上に」 share
  some conceptual overlap with 「また」, their usage contexts, formality, and specific nuances differ significantly.
  「また」 is a general-purpose term for 'repetition' or 'addition' in everyday language. 「再び」 leans towards
  formality for direct repetition. 「更に」 suggests an increase or intensification. 「それに」 adds a related
  point, often with a logical flow. 「および」 is a formal connective for lists. 「あるいは」 explicitly offers an
  alternative. 「且つ」 links concurrent or combined elements in a formal tone. 「上に」 emphasizes cumulative
  qualities. Discerning these subtle distinctions is key to precise Japanese communication.
examples:
  - english: Let's meet again next week.
    japanese:
      - 来週 も {また} 会い ましょう。
      - 来週 {また} お 会い し ましょう。
      - 来週 も {また} お 会い 致し ましょう。
    english_literally: Next week again let's meet.
    competing_grammar:
      - competing_japanese:
          - 来週 も {再び} 会い ましょう。
        english: Let's meet once more next week.
        hint: 「再び」 is more formal and literary, suggesting a significant reoccurrence. We're looking for
          a more common, general way to say 'again' in everyday conversation.
    scene: A friendly farewell after a pleasant gathering, expressing a desire for future encounters.
    register: teineigo (polite)
    setting: friendly
  - english: He is a famous singer. Moreover, he is also active as an actor.
    japanese:
      - 彼 は 有名 な 歌手 です。{また}、俳優 と し て も 活躍 し て い ます。
      - 彼 は 有名 な 歌手 で、{また} 俳優 と し て も 活躍 し て い ます。
      - 彼 は 有名 な 歌手 です。それ から、{また} 俳優 と し て も 活躍 し て い ます。
    english_literally: He is a famous singer. Moreover, as an actor too, he is active.
    competing_grammar:
      - competing_japanese:
          - 彼 は 有名 な 歌手 です。{更に}、俳優 と し て も 活躍 し て い ます。
        english: He is a famous singer. Furthermore, he is also active as an actor.
        hint: 「更に」 implies an escalation or intensification, suggesting the acting is 'even more' significant.
          We're looking to simply add another related piece of information.
      - competing_japanese:
          - 彼 は 有名 な 歌手 です。{それ に}、俳優 と し て も 活躍 し て い ます。
        english: He is a famous singer. Besides that, he is also active as an actor.
        hint: 「それに」 adds a related point, often with a slightly stronger causal or directly additive link.
          We're looking for a general 'moreover' or 'in addition'.
      - competing_japanese:
          - 彼 は 有名 な 歌手 です。{且つ}、俳優 と し て も 活躍 し て い ます。
        english: He is a famous singer, and at the same time, he is also active as an actor.
        hint: 「且つ」 is a very formal and literary conjunction, emphasizing simultaneous existence. We're
          looking for a more common way to simply add information.
      - competing_japanese:
          - 彼 は 有名 な 歌手 で ある {上 に}、俳優 と し て も 活躍 し て い ます。
        english: On top of being a famous singer, he is also active as an actor.
        hint: 「上に」 implies a cumulative effect, emphasizing 'not only X, but also Y'. We're looking for
          a simple additive statement.
    scene: A talent agent describing a client's diverse skills to a director.
    register: teineigo (polite)
    setting: professional
    speaker_gender: male
    listener_gender: male
    speaker_age: older
    nuance: 「また」 is used here to add an additional piece of information about the subject's activities.
      It emphasizes the breadth of his talents. The use of 「活躍 しています」 (is active/doing well) further highlights
      his successful involvement in both fields.
  - english: This restaurant is cheap, and also the food is delicious.
    japanese:
      - この レストラン は 安く、{また} 料理 も 美味しい です。
      - この レストラン は 安い し、{また} 料理 も 美味しい です。
      - この レストラン は 安い。{また}、料理 も 美味しい です。
    english_literally: This restaurant is cheap, and also food is delicious.
    competing_grammar:
      - competing_japanese:
          - この レストラン は 安く、{更に} 料理 も 美味しい です。
        english: This restaurant is cheap, and furthermore, the food is delicious.
        hint: 「更に」 implies an escalation or intensification, suggesting the deliciousness is 'even more'
          significant. We're looking for a general 'and also' to list another attribute.
      - competing_japanese:
          - この レストラン は 安く、{それ に} 料理 も 美味しい です。
        english: This restaurant is cheap, and besides, the food is delicious.
        hint: 「それに」 adds a related point, often with a slightly stronger causal or directly additive link.
          We're looking for a simple 'and also'.
      - competing_japanese:
          - この レストラン は 安い {上 に}、料理 も 美味しい です。
        english: On top of this restaurant being cheap, the food is delicious.
        hint: 「上に」 implies a cumulative effect, emphasizing 'not only X, but also Y'. We're looking for
          a simple additive statement.
    scene: A food critic reviewing a new restaurant, highlighting multiple positive aspects.
    register: teineigo (polite)
    setting: informative
    speaker_gender: female
    listener_gender: group
    speaker_age: older
    nuance: 「また」 connects two positive attributes of the restaurant, emphasizing that it's good in multiple
      ways. The polite 「です」 ending makes it suitable for a formal review or recommendation to a general
      audience. The use of 「美味しい」 (delicious) adds a strong positive sentiment.
  - english: She is a student, and also does volunteer activities.
    japanese:
      - 彼女 は 学生 で あり、{また}、ボランティア 活動 も し て い ます。
      - 彼女 は 学生 で、{また} ボランティア 活動 も し て い ます。
      - 彼女 は 学生 で、{また} ボランティア も し て い ます。
    english_literally: She is a student, and also volunteer activities too, she does.
    competing_grammar:
      - competing_japanese:
          - 彼女 は 学生 で あり、{更に}、ボランティア 活動 も し て い ます。
        english: She is a student, and furthermore, she also does volunteer activities.
        hint: 「更に」 implies an escalation or intensification, suggesting the volunteer activities are 'even
          more' significant. We're looking to simply add another related piece of information.
      - competing_japanese:
          - 彼女 は 学生 で あり、{それ に}、ボランティア 活動 も し て い ます。
        english: She is a student, and besides that, she also does volunteer activities.
        hint: 「それに」 adds a related point, often with a slightly stronger causal or directly additive link.
          We're looking for a general 'and also'.
      - competing_japanese:
          - 彼女 は 学生 で あり {且つ} ボランティア 活動 も し て い ます。
        english: She is a student and at the same time also does volunteer activities.
        hint: 「且つ」 is a very formal and literary conjunction, emphasizing simultaneous existence. We're
          looking for a more common way to simply add information.
      - competing_japanese:
          - 彼女 は 学生 で ある {上 に}、ボランティア 活動 も し て い ます。
        english: On top of being a student, she is also active as an actor.
        hint: 「上に」 implies a cumulative effect, emphasizing 'not only X, but also Y'. We're looking for
          a simple additive statement.
    scene: A teacher describing a diligent student's various commitments.
    register: teineigo (polite)
    setting: academic
    speaker_gender: male
    listener_gender: female
    speaker_age: older
    nuance: 「また」 introduces an additional aspect of her life beyond being a student, highlighting her
      industriousness. 「〜であり」 is a more formal way to connect two descriptive clauses, emphasizing her
      dual roles. 「活動 もしています」 (also does activities) shows active engagement.
  - english: The participation fee is 500 yen. Additionally, children are free.
    japanese:
      - 参加 費 は ５００ 円 です。{また}、お 子 さん は 無料 です。
      - 参加 費 は ５００ 円 で、{また} お 子 さん は 無料 です。
      - 参加 費 は ５００ 円 です。それ から、{また} お 子 さん は 無料 です。
    english_literally: Participation fee is 500 yen. Additionally, children are free.
    competing_grammar:
      - competing_japanese:
          - 参加 費 は ５００ 円 です。{それ に}、お 子 さん は 無料 です。
        english: The participation fee is 500 yen. Besides, children are free.
        hint: 「それに」 adds a related point, often with a slightly stronger causal or directly additive link.
          We're looking for a general 'additionally'.
      - competing_japanese:
          - 参加 費 は ５００ 円 です。{その 上}、お 子 さん は 無料 です。
        english: The participation fee is 500 yen. On top of that, children are free.
        hint: 「その上」 also implies an addition, often of something extra or a bonus. We're looking for a
          more general 'additionally'.
      - competing_japanese:
          - 参加 費 は ５００ 円 の {上 に}、お 子 さん は 無料 です。
        english: On top of the participation fee being 500 yen, children are free.
        hint: 「上に」 implies a cumulative effect or an extra benefit. We're looking for a simple additive
          statement.
    scene: An organizer explaining event details to attendees.
    register: teineigo (polite)
    setting: instructional
    speaker_gender: female
    listener_gender: group
    speaker_age: older
    nuance: 「また」 introduces a new, related piece of information about the fee structure. It's used to
      add a supplementary detail that modifies the preceding statement about the fee. 「お子さん は 無料 です」 (children
      are free) is a clear and direct statement, common in event information.
  - english: He is serious, and also good at sports.
    japanese:
      - 彼 は 真面目 だ し、{また}、運動 も 得意 です。
      - 彼 は 真面目 だ し、{また} 運動 も 得意 だ。
      - 彼 は 真面目。{また} 運動 も 得意 です。
    english_literally: He is serious, and also sports too, is good at.
    competing_grammar:
      - competing_japanese:
          - 彼 は 真面目 だ し、{更に}、運動 も 得意 です。
        english: He is serious, and furthermore, he is good at sports.
        hint: 「更に」 implies an escalation or intensification, suggesting his sports ability is 'even more'
          significant. We're looking for a simple 'and also' to list another attribute.
      - competing_japanese:
          - 彼 は 真面目 だ し、{それ に}、運動 も 得意 です。
        english: He is serious, and besides, he is good at sports.
        hint: 「それに」 adds a related point, often with a slightly stronger causal or directly additive link.
          We're looking for a simple 'and also'.
      - competing_japanese:
          - 彼 は 真面目 な {上 に}、運動 も 得意 です。
        english: On top of him being serious, he is good at sports.
        hint: 「上に」 implies a cumulative effect, emphasizing 'not only X, but also Y'. We're looking for
          a simple additive statement.
    scene: A coach evaluating a new team member, mentioning several strengths.
    register: casual
    setting: informative
    speaker_gender: male
    listener_gender: male
    speaker_age: younger
    nuance: 「〜し」 lists reasons or attributes, and 「また」 adds another quality. This informal construction
      implies a positive cumulative impression. 「得意です」 (is good at) highlights a natural aptitude, reinforcing
      the positive evaluation.
  - english: Please inquire by phone or email.
    japanese:
      - お 電話 {また は} メール で お 問い合わせ ください。
      - お 電話 {また は} E メール で お 問い合わせ ください。
    english_literally: By phone or email, please inquire.
    competing_grammar:
      - competing_japanese:
          - お 電話 {あるいは} メール で お 問い合わせ ください。
        english: Please inquire by phone or alternatively by email.
        hint: 「あるいは」 is a very formal and explicit way to present alternatives. While it can often be
          interchangeable with 「または」, 「または」 is more common in general formal contexts.
    scene: A customer service representative giving contact options.
    register: teineigo (polite)
    setting: professional
  - english: I'm home again.
    japanese:
      - '{また} 帰っ て き まし た。'
      - '{また} 帰っ て き た。'
      - '{また} 戻っ て 参り まし た。'
    english_literally: Again, I have returned.
    competing_grammar:
      - competing_japanese:
          - '{再び} 帰っ て き まし た。'
        english: I have returned once more.
        hint: 「再び」 is more formal and less common in daily greetings like returning home. We're looking
          for the common, everyday way to express 'again' in this context.
    scene: A person arriving back at their house after a long trip.
    register: teineigo (polite)
    setting: friendly
    speaker_gender: male
    listener_gender: no one
    speaker_age: younger
    nuance: 「また」 here signifies the recurrence of the action of returning home, often said upon entering
      one's residence. The phrase 「帰ってきました」 is a common and polite way to announce one's return, even
      if no one is explicitly listening, acting as a statement of presence.
  - english: This book is interesting. Also, the illustrations are beautiful.
    japanese:
      - この 本 は 面白い です。{また}、挿絵 も 綺麗 です。
      - この 本 は 面白い し、{また} 挿絵 も 綺麗 です。
      - この 本 は 面白い です し、{また} 挿絵 も 綺麗 です。
      - この 本 面白い ね。{また}、挿絵 も 綺麗 だ よ。
    english_literally: This book is interesting. Also, illustrations too are beautiful.
    competing_grammar:
      - competing_japanese:
          - この 本 は 面白い です。{更に}、挿絵 も 綺麗 です。
        english: This book is interesting. Furthermore, the illustrations are beautiful.
        hint: 「更に」 suggests an intensification or higher degree. We are simply listing another positive
          attribute without implying escalation.
    scene: Discussing a newly read book with a friend.
    register: teineigo (polite)
    setting: informative
    speaker_gender: female
    listener_gender: female
    speaker_age: younger
    nuance: 「また」 is used to add another positive attribute of the book. The particle 「も」 after 「挿絵」 emphasizes
      that the illustrations are **also** beautiful, reinforcing the additive nature of 「また」 in this context.
      The polite 「です」 makes it suitable for a friendly conversation.
  - english: See you again tomorrow.
    japanese:
      - '{また} 明日。'
      - '{また} 明日 ね。'
      - '{また} 明日 お 会い し ましょう。'
    english_literally: Again tomorrow.
    competing_grammar:
      - competing_japanese:
          - '{再び} 明日。'
        english: Tomorrow, once more.
        hint: While grammatically possible, 「再び明日」 sounds too formal for a common farewell. We're looking
          for a casual way to say 'see you again tomorrow'.
    scene: A common parting phrase between friends or colleagues.
    register: casual
    setting: friendly
    nuance: 「また明日」 is a common, informal way to say goodbye and imply meeting again the next day. Adding
      「ね」 softens it and seeks agreement. 「また明日お会いしましょう」 is more formal and polite. The simplicity of
      「また明日」 makes it highly versatile in casual settings.
post_example_writeup: The examples illustrate 「また」 in its various roles. Pay close attention to the context
  to discern whether it implies simple repetition, the addition of a new item or fact, or an alternative.
  The particle 「は」 can be added to 「また」 to explicitly state 'or', as seen in the examples using 「または」.
