post_example_writeup: Understanding the subtle differences between 「としたら」, 「とすれば」, and 「とすると」 often comes
  with practice. While 「としたら」 is generally more conversational and focuses on a simple hypothetical, 「とすれば」
  and 「とすると」 carry a stronger implication of logical deduction or a premise leading to a conclusion. The
  context of the conversation and the desired emphasis on causality or assumption will guide your choice.
