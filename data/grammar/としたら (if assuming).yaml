grammar_point: としたら (if assuming)
learn_before:
  - Noun が Noun なら (if it were a proper x)
  - Verb[えば] (conditional)
  - もしかしたら (perhaps)
meaning: If it were the case that, assuming that...
meaning_warning: Hypothetical
conjugations:
  - conjugation-type: conditional (～たら)
    form: としたら
    rarity: common
    meaning: if it were the case that
  - conjugation-type: conditional (～ば)
    form: とすれば
    rarity: common
    meaning: assuming that
  - conjugation-type: dictionary (plain non-past)
    form: とすると
    rarity: common
    meaning: if it turns out that
pronunciation:
  katakana: トシタラ・トスレバ・トスルト
  romaji: to shitara / to sureba / to suru to
formation:
  Verb (plain form) + としたら: Used for a hypothetical scenario involving an action or state.
  Verb (plain form) + とすれば: Used for a hypothetical scenario involving an action or state, often implying
    a logical consideration.
  Verb (plain form) + とすると: Used for a hypothetical scenario involving an Preb (plain form) + とするとverb
    or state, often leading to a logical consequence.
  い-Adjective (plain form) + としたら: Used for a hypothetical scenario involving an i-adjective quality.
  な-Adjective (stem) + だとしたら: Used for a hypothetical scenario involving a na-adjective quality.
  Noun + だとしたら: Used for a hypothetical scenario involving a noun.
  Noun + だとすると: Used for a hypothetical scenario involving a noun.
jlpt: N3
etymology: This grammar point is formed by combining the particle 「と」 with different conjugations of the
  verb 「する」 (to do). 「したら」 is the past conditional form, 「すれば」 is the conditional form (ba-form), and
  「すると」 is the plain form followed by 「と」. The 「と」 particle marks the preceding clause as a condition
  or assumption, much like how it can indicate quotation or result. The various forms of 「する」 add slightly
  different shades of conditionality, from a simple hypothetical (としたら) to a logical premise (とすれば/とすると).
writeup: |-
  The grammar points 「としたら」, 「とすれば」, and 「とすると」 are used to express a hypothetical situation and its potential result. While there are subtle nuances, they are generally used interchangeably to mean "if it were the case that (A), then (B)" or "assuming that (A), then (B)".

  To use these expressions, simply attach 「と」 and your chosen variation of 「する」 to the end of a verb in its plain form, an い-adjective in its plain form, or a noun/な-adjective followed by 「だ」. They are similar to 「もし」, but can often sound a bit more formal or analytical, particularly 「とすれば」 and 「とすると」.
false_friends:
  - term: 場合 は
    meaning: In the event of, In the case of
    kind: similar expression
    nuance: Unlike 「としたら・とすれば・とすると」 which introduce general hypothetical scenarios, 「場合 は」 specifies a
      concrete case or situation.
    grammar_point: ばあいは (in the event of)
  - term: なら
    meaning: Were it, If, If it's the case, As for (Conditional)
    kind: similar expression
    nuance: While 「なら」 also expresses a conditional, it often implies a response or suggestion based on
      a perceived or stated condition, and is generally more colloquial than 「としたら・とすれば・とすると」.
    grammar_point: なら (conditional, if it's the case that A)
  - term: としても
    meaning: Even if (we assume), Assuming, Also as
    kind: similar expression
    nuance: 「としても」 indicates a concessive hypothetical, meaning 'even if' something is the case, the outcome
      remains unchanged or is unexpected. It presents a stronger concession than the simple hypothetical
      of 「としたら・とすれば・とすると」.
    grammar_point: としても (even if assumed)
  - term: と
    meaning: If, when, whenever; expresses a natural consequence or a general truth.
    kind: similar expression
    nuance: Unlike 「としたら・とすれば・とすると」 which introduce a hypothetical or assumed situation that may or may
      not be true, 「と」 typically describes an inevitable or general outcome that always occurs under a
      given condition.
    grammar_point: と (conditional, inevitable result)
  - term: もしも
    meaning: If, Supposing
    kind: similar expression
    nuance: While both introduce hypothetical situations, 「もしも」 often emphasizes a strong, often unlikely
      or extreme, hypothetical condition. 「としたら・とすれば・とすると」 are more neutral in setting up a premise for
      logical consideration.
    grammar_point: もし・もしも (if, emphasis)
post_false_friends_writeup: While 「としたら・とすれば・とすると」, 「場合 は」, 「なら」, 「としても」, 「と」, and 「もしも」 all deal with
  conditional expressions, their specific applications vary. 「としたら・とすれば・とすると」 are used to introduce a
  general hypothetical situation or assumption for consideration. 「場合 は」 focuses on a concrete 'case'
  or 'event'. 「なら」 often implies a reaction or suggestion based on existing information. 「としても」 sets up
  a 'concessive' condition, meaning 'even if' something is true. 「と」 describes a general or inevitable
  consequence. 「もしも」 emphasizes a strong or unlikely hypothetical. Understanding these distinctions is
  key to using them correctly.
examples:
  - english: If it were to snow tomorrow, traffic would probably be chaotic.
    japanese:
      - もし 明日 雪 が 降る {と し たら}、交通 は 混乱 する でしょう。
      - もし 明日 雪 が 降る {と すれ ば}、交通 は 混乱 する でしょう。
      - もし 明日 雪 が 降る {と する と}、交通 は 混乱 する でしょう。
    english_literally: If tomorrow snow falls, traffic probably chaotic will become.
    competing_grammar:
      - competing_japanese:
          - もし 明日 雪 が {降れ ば}、交通 は 混乱 する でしょう。
        english: If it were to snow tomorrow, traffic would probably be chaotic.
        hint: The ば form expresses a general condition with a natural outcome. While grammatically correct,
          としたら emphasizes a hypothetical scenario or assumption. We're looking for an expression that
          clearly sets up a hypothetical case for consideration.
      - competing_japanese:
          - 明日 雪 が 降る {場合 は}、交通 は 混乱 する でしょう。
        english: In the case that it snows tomorrow, traffic would probably be chaotic.
        hint: 場合 は (baai wa) is used for specific, concrete situations or cases, whereas としたら is for general
          hypothetical scenarios. We're looking for a general hypothetical scenario here.
