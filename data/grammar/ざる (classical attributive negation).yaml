      - competing_japanese:
          - 彼女 の 動じ {ず} 決意 が、困難 な 状況 を 乗り越える 力 と なっ た。
        english: Her determination, without flinching, became the strength to overcome difficult situations.
        hint: 「動じ ず」 means 'without flinching' and functions adverbially. We're looking for a form that
          modifies 'determination' to mean 'unshakable' as an inherent characteristic.
    scene: A group of colleagues discussing the inspiring leadership of a female manager.
    register: formal
    setting: supportive
    speaker_gender: female
    nuance: The female speaker uses 「動じ ざる」 (動じる + ざる) to describe the manager's unwavering determination,
