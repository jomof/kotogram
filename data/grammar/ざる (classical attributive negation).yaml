      - competing_japanese:
          - これ は めった に 得 {ず} 貴重 な 経験 です。ぜひ 参加 し て ください。
        english: This is a precious experience, rarely obtaining. Please participate.
        hint: 「得 ず」 means 'without obtaining' and functions adverbially. We're looking for an attributive
          form that modifies 'experience' to mean 'rarely obtained' or 'unobtainable' as a characteristic
          of the experience itself.
    scene: A teacher advising a student about a unique learning opportunity.
    register: formal
    setting: persuasive
  - english: The unseen enemy posed a grave threat to the nation's security.
    japanese:
      - '{見え ざる} 敵 が 国家 の 安全 に 深刻 な 脅威 を もたらし た。'
      - '{見え ざる} 敵 が 国家 の 安全 に 深刻 な 脅威 を もたらし まし た。'
      - 国家 の 安全 に 対し、{見え ざる} 敵 が 深刻 な 脅威 を もたらし て いる。
      - '{見え ざる} 敵 は、国家 の 安全 に とっ て 深刻 な 脅威 で あっ た。'
    english_literally: Unseen enemy, nation's security to serious threat brought.
    competing_grammar:
      - competing_japanese:
          - 見え {ない} 敵 が 国家 の 安全 に 深刻 な 脅威 を もたらし た。
        english: The invisible enemy posed a grave threat to the nation's security.
        hint: 「見え ざる」 conveys a more abstract, inherent, or mysterious quality of being unseen, often
          used in formal or literary contexts to describe a concept or a formidable, undefined opponent.
          「見え ない」 simply means 'cannot be seen' and is less formal. We're looking for an enemy whose essence
          is its unseen nature.
      - competing_japanese:
          - 見え {ぬ} 敵 が 国家 の 安全 に 深刻 な 脅威 を もたらし た。
        english: The enemy that cannot be seen posed a grave threat to the nation's security.
        hint: While 「見え ぬ」 is also classical, 「見え ざる」 specifically functions as an attributive form, directly
          modifying the noun '敵' to imply a deeper, intrinsic state of being unseen. 「見え ぬ」 can sometimes
          function more adverbially or predicatively depending on context. We're looking for an attributive
          form.
    scene: A military analyst presents a briefing on potential threats.
