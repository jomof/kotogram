      - 彼女 の {動じ ざる} 決意 が、困難 な 状況 を 乗り越える 力 と なっ た。
      - 彼女 の {動じ ざる} 決意 が、困難 な 状況 を 乗り越える 力 と なり まし た。
      - 困難 な 状況 を 乗り越える 力 は、彼女 の {動じ ざる} 決意 に あっ た。
