      - 彼 の {飽き ざる} 探求 心 は、ついに その 真実 を 明らか に し た。
      - 彼 の {飽き ざる} 探求 心 が、ついに その 真実 を 明らか に し まし た。
      - '{飽き ざる} 探求 心 が あっ た から こそ、彼 は ついに その 真実 を 見つけ 出し た。'
      - ついに その 真実 は、彼 の {飽き ざる} 探求 心 に よっ て 明らか に さ れ た。
    english_literally: His insatiable spirit of inquiry, finally that truth revealed.
    competing_grammar:
      - competing_japanese:
          - 彼 の 飽き {ない} 探求 心 は、ついに その 真実 を 明らか に し た。
        english: His untiring spirit of inquiry finally revealed the truth.
        hint: 「飽き ない」 is the standard modern negative, simply meaning 'not tiring'. 「飽き ざる」 carries a
          more classical and profound nuance of being inherently insatiable, often used in literary descriptions
          of persistent dedication. We're looking for a word that emphasizes an inherent, deep-seated
          quality of relentless pursuit.
      - competing_japanese:
          - 彼 の 飽き {ず} 探求 心 は、ついに その 真実 を 明らか に し た。
        english: His spirit of inquiry without tiring finally revealed the truth.
        hint: 「飽き ず」 functions adverbially, meaning 'without tiring'. 「飽き ざる」 is an attributive form,
          directly describing '探求心' as 'insatiable'. We need a form that modifies the noun to convey an
          inherent characteristic.
    scene: A biographer narrating the life of a great scholar known for his persistent research.
    register: formal
    setting: storytelling
    nuance: The use of 「飽き ざる」 (飽きる + ざる) emphasizes the relentless and never-tiring nature of his curiosity,
      highlighting a profound, almost inherent, intellectual drive that led to a significant discovery.
      This formal expression suits a narrative about a dedicated scholar.
    etymology: 「飽きる」 means to get tired of or to be satiated. Combined with 「ざる」, it forms a classical
      negative emphasizing an unyielding or insatiable quality.
post_example_writeup: As seen in the examples, 「〜ざる」 is often used in combination with nouns that express
  abstract concepts or qualities, such as 「才能」 (talent), 「研究」 (research), 「事故」 (accident), 「賢さ」 (wisdom),
  「決意」 (determination), 「経験」 (experience), 「敵」 (enemy), 「友情」 (friendship), 「姿」 (appearance), 「夢」 (dream),
  or 「探求心」 (spirit of inquiry). This highlights its use in conveying a deep or inherent negation or characteristic
  of these qualities, describing things like undiscovered talents, relentless efforts, unforeseen events,
  quiet wisdom, unshakable resolve, rarely obtained experiences, unseen enemies, unbreakable bonds, unchanged
  appearances, unattainable dreams, and insatiable curiosity. It also frequently appears in set phrases
  like 「たゆま ざる 努力」 (unceasing effort) or 「予期 せ ざる 事態」 (unforeseen situation), which further cements its
  role in more formal and literary expressions.
