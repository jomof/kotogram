grammar_point: ざる (classical attributive negation)
learn_before:
  - つつも (even though, despite・internal conflict or contradiction)
  - なお (still; even; yet; still more)
  - に伴って・に伴い (along with・as a result of)
  - に対して (towards; in contrast)
  - めったに〜ない (rarely)
  - を経て (after process or experience)
  - 姿 (figure・appearance)
  - 遂に (finally・at last)
meaning: To not ~, Un~
pronunciation:
  katakana: ザル
  romaji: zaru
formation:
  Verb[imperfective] + ざる: Indicates a state of not doing something, often emphasizing the unchanging
    or continuous nature of the action.
jlpt: N2
etymology: 「ざる」 is the attributive form of the classical auxiliary verb 「ず」, indicating negation. 「ず」
  itself is derived from older forms of negation in Japanese. It carries the same 'not' meaning as 「ない」,
  but is more formal and literary. Its attributive nature means it modifies nouns, functioning similarly
  to an adjective.
writeup: The grammar point 「Verb[imperfective]+ざる」 represents the attributive form of the classical auxiliary
  verb 「ず」, expressing negation. It holds a meaning equivalent to 「ない」, but carries a significantly more
  formal, literary, and sometimes archaic tone. You will primarily encounter 「ざる」 in written contexts
  such as historical texts, news articles, academic papers, or established idiomatic expressions. While
  「ざる」 functions similarly to 「ない」, its use in modern spoken Japanese is largely confined to specific
  set phrases. For instance, it is a key component of the common grammar structure 「〜ざるを得ない」 (to have
  no choice but to...). Using 「ざる」 in casual conversation outside of these fixed expressions would sound
  unnatural or overly stiff. Characteristic of its older grammatical origins, when combined with the irregular
  verb 「する」, 「ざる」 connects to its classical 「せ」 stem, resulting in 「せざる」, rather than the more common
  modern 「し」 stem.
false_friends:
  - term: 〜ない
    meaning: not
    kind: similar expression
    nuance: Unlike 「〜ざる」, 「〜ない」 is the standard and most common negative form used in everyday conversation.
      While both express negation, 「〜ざる」 is considerably more formal and literary.
    grammar_point: <suggest>:ない (plain negative)
  - term: 〜ず
    meaning: not (classical negative)
    kind: similar expression
    nuance: 「〜ず」 is the general negative form of classical Japanese, from which 「〜ざる」 (its attributive
      form) is derived. 「〜ず」 is used predicatively or adverbially, whereas 「〜ざる」 directly modifies a noun.
      Both are classical, but 「〜ざる」 specifically functions as an an attributive, characterizing the noun.
    grammar_point: <suggest>:ず (classical negative)
  - term: 〜ざるを得ない
    meaning: cannot help but do ~, have no choice but to do ~
    kind: similar expression
    nuance: Although 「〜ざるを得ない」 contains 「ざる」, it is an idiomatic expression that conveys obligation or
      unavoidability, entirely different from the simple attributive negation of 「〜ざる」. Do not confuse
      their meanings.
    grammar_point: ざるを得ない (have no choice but to)
post_false_friends_writeup: While 「〜ざる」, 「〜ない」, and 「〜ず」 all convey negation, their usage contexts and
  nuances differ significantly. 「〜ない」 is the modern, ubiquitous negative. 「〜ず」 is a classical negative
  that functions adverbially or predicatively. 「〜ざる」, on the other hand, is the *attributive* form of
  「〜ず」, meaning it directly modifies a noun. Therefore, while you might say 「彼 は 来 ず」 (He didn't come)
  or 「彼 は 来 ない」 (He doesn't come), you would use 「来 ざる 者」 (a person who does not come) to describe someone
  in a literary context. Choosing the correct form depends on the desired register, context, and grammatical
  function. Furthermore, while 「〜ざるを得ない」 includes 「ざる」, it's a distinct idiom meaning 'cannot help but
  do', so it's crucial not to conflate its meaning with the attributive negation of 「ざる」.
examples:
  - english: Her undiscovered talent was very useful in this project.
    japanese:
      - 彼女 の {知ら れ ざる} 才能 が、今回 の プロジェクト で 大きく 役立っ た。
      - 彼女 の {知ら れ ざる} 才能 が、今回 の プロジェクト で 大きく 役 に 立ち まし た。
      - 今回 の プロジェクト に、彼女 の {知ら れ ざる} 才能 が 大いに 貢献 し まし た。
      - 今回 の プロジェクト に は、彼女 の {知ら れ ざる} 才能 が 大いに 貢献 し た。
    english_literally: Her unknown talent, this time's project at, greatly was useful.
    competing_grammar:
      - competing_japanese:
          - 彼女 の 知ら {ない} 才能 が、今回 の プロジェクト で 大きく 役立っ た。
        english: Her unknown talent (to others) was very useful in this project.
        hint: 「知ら れ ざる」 implies an inherent, perhaps latent, talent that existed but was not yet brought
          to light, fitting the context of blooming and becoming useful. 「知ら ない」 would simply mean 'unknown'
          to others, which is less precise for describing a deep-seated ability. We're looking for an
          inherent lack of discovery.
      - competing_japanese:
          - 彼女 の 知ら れ {ず} 才能 が、今回 の プロジェクト で 大きく 役立っ た。
        english: Her talent, without being known, was very useful in this project.
        hint: 「知ら れ ず」 is an adverbial form, meaning 'without being known.' We're looking for an attributive
          form that modifies 'talent' to mean 'undiscovered,' implying an inherent quality.
    scene: A team leader praising a member who showed unexpected skills during a review meeting.
    register: formal
    setting: informative
  - english: He continued his relentless research and finally discovered a new medicine.
    japanese:
      - 彼 は {たゆま ざる} 研究 を 続け、遂に 新薬 を 発見 し た。
      - 彼 は {たゆま ざる} 研究 を 続け、遂に 新薬 を 発見 いたし まし た。
      - '{たゆま ざる} 研究 を 続け た 結果、彼 は 新薬 を 発見 し た。'
      - 彼 は {たゆま ざる} 研究 に 励み、ついに 新薬 を 発見 し まし た。
    english_literally: He unrelenting research continued, finally new medicine discovered.
    competing_grammar:
      - competing_japanese:
          - 彼 は たゆま {ない} 研究 を 続け、遂に 新薬 を 発見 し た。
        english: He continued his unfaltering research, and finally discovered a new medicine.
        hint: 「たゆま ざる」 in this formal context emphasizes the continuous and unwavering nature of his research,
          highlighting his exceptional dedication, more so than the simple descriptive 「たゆま ない」. It conveys
          a more profound sense of perseverance. We're looking for a word that highlights a profound sense
          of perseverance.
      - competing_japanese:
          - 彼 は たゆま {ず} 研究 を 続け、遂に 新薬 を 発見 し た。
        english: He continued his research without resting, and finally discovered a new medicine.
        hint: 「たゆま ず」 means 'without resting' and functions adverbially. We're looking for a form that
          modifies 'research' to mean 'relentless' or 'unwavering,' describing a characteristic of the
          research itself.
    scene: A scientific community discussing the unwavering dedication of a researcher.
    register: formal
    setting: serious
    speaker_gender: male
    nuance: The male speaker uses 「たゆま ざる」 (たゆむ + ざる) to convey the unrelenting and persistent nature
      of the researcher's work, which is typical in formal academic or scientific discourse to express
      admiration for profound dedication.
    etymology: 「たゆむ」 means to slacken or falter. Combined with 「ざる」, it forms a classical negative emphasizing
      an unyielding quality.
  - english: Due to an unforeseen accident, today's ceremony was canceled.
    japanese:
      - '{予期 せ ざる} 事故 に より、本日 の 式典 は 中止 と なっ た。'
      - '{予期 せ ざる} 事故 に より、本日 の 式典 は 中止 と なり まし た。'
      - '{予期 せ ざる} 事故 の ため、本日 の 式典 は 中止 と なっ た。'
      - 本日 の 式典 は、{予期 せ ざる} 事故 が 発生 し た こと に 伴い、中止 と なり まし た。
    english_literally: Unforeseen accident by, today's ceremony was canceled.
    competing_grammar:
      - competing_japanese:
          - 予期 し {ない} 事故 に より、本日 の 式典 は 中止 と なっ た。
        english: Due to an unexpected accident, today's ceremony was canceled.
        hint: 「予期 せ ざる」 implies a formal and serious tone regarding an unexpected event, suitable for
          an official announcement, conveying a sense of unavoidable external circumstances beyond control.
          「予期 し ない」 is less formal. We're looking for a more formal and official term.
      - competing_japanese:
          - 予期 せ {ず} 事故 に より、本日 の 式典 は 中止 と なっ た。
        english: Due to an accident without foreseeing, today's ceremony was canceled.
        hint: 「予期 せ ず」 means 'without foreseeing' and functions adverbially. We need an attributive form
          that modifies 'accident' to mean 'unforeseen' as an inherent quality of the accident.
    scene: An official making a formal announcement about an emergency.
    register: formal
    setting: informative
  - english: That old man, though not one to speak much, possesses deep wisdom.
    japanese:
      - あの 老人 は、多く を {言わ ざる} もの の、深い 賢 さ を 持っ て いる。
      - あの 老人 は、多く を {言わ ざる} もの の、深い 賢 さ を お 持 ち です。
      - 多く を {言わ ざる} あの 老人 は、深い 賢 さ を 兼ね備え て いる。
      - あの 老人 は {言わ ざる} 人物 ながら も、深い 賢 さ を 備え て いる。
    english_literally: That old man, many things not speaking, deep wisdom possesses.
    competing_grammar:
      - competing_japanese:
          - あの 老人 は、多く を 言わ {ない} もの の、深い 賢 さ を 持っ て いる。
        english: That old man, though not saying much, possesses deep wisdom.
        hint: 「言わ ざる」 is a more literary and respectful way to describe someone who inherently chooses
          not to speak much, fitting the portrayal of a wise elder whose silence implies depth rather
          than just a simple lack of talkativeness. We're looking for a term that conveys inherent quietness.
      - competing_japanese:
          - あの 老人 は、多く を 言わ {ず} もの の、深い 賢 さ を 持っ て いる。
        english: That old man, though not speaking much, possesses deep wisdom.
        hint: 「言わ ず」 means 'without speaking' or 'not speaking' in an adverbial sense. We need an attributive
          form that describes the old man as 'not one to speak much,' characterizing him as such.
    scene: A young person reflecting on an elderly mentor.
    register: semi-formal
    setting: reflective
    speaker_age: younger
    nuance: The younger speaker uses 「言わ ざる」 (言う + ざる) to describe the elder as someone who is inherently
      not talkative, adding a tone of respect and reverence for their quiet, profound wisdom. This choice
      reflects a mature and contemplative observation.
    etymology: 「言う」 means to say or speak. With 「ざる」, it forms a classical negative describing a quality
      of not speaking or being silent.
  - english: Her unshakable determination became the strength to overcome difficult situations.
